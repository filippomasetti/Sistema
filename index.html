.rk-c{width:104px;height:115px;overflow:visible}
.rk-c path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:0}
.rk-c .m{stroke:#EAF3FF;stroke-width:1.6;filter:drop-shadow(0 0 3px rgba(124,196,255,.95))}
.rk-c .t{stroke:#CFEAFF;stroke-width:.8;opacity:.85}
.rk-l{clip-path:polygon(0 0,50% 0,44% 38%,56% 60%,50% 100%,0 100%)}
.rk-r{clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%,56% 60%,44% 38%)}
.rk-lk{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,rgba(124,196,255,.4),rgba(124,196,255,0) 60%);pointer-events:none}
.rk-n{opacity:0}
.rkst:not(.br) .rk-old{animation:fxshake .5s linear infinite}
.rkst:not(.br) .rk-lk{animation:fxpulse 1.4s ease-in-out infinite}
@keyframes fxshake{0%,100%{transform:none}20%{transform:translate(1.2px,-.4px) rotate(.6deg)}40%{transform:translate(-1.4px,.5px) rotate(-.7deg)}60%{transform:translate(1px,.4px) rotate(.5deg)}80%{transform:translate(-1px,-.5px) rotate(-.5deg)}}
@keyframes fxpulse{0%,100%{opacity:.55;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}
.rkst.run:not(.br) .rk-old{animation:fxtremble 1.5s linear .1s both,fxshake .5s linear 1.6s infinite}
.rkst.run:not(.br) .rk-c path{animation:fxdraw .3s ease-out var(--dl) both}
.rkst.run:not(.br) .rk-lk{animation:fxleak 1.1s ease-in .5s both,fxpulse 1.4s ease-in-out 1.6s infinite}
@keyframes fxtremble{0%{transform:none}20%{transform:translate(-.6px,.3px)}40%{transform:translate(-1.2px,.5px) rotate(-.5deg)}55%{transform:translate(1.6px,-.6px) rotate(.8deg)}70%{transform:translate(-2px,.8px) rotate(-1deg)}85%{transform:translate(2.4px,-.6px) rotate(1.2deg)}100%{transform:none}}
@keyframes fxdraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes fxleak{from{opacity:0;transform:scale(.6)}to{opacity:.55;transform:scale(.95)}}
.rk-tip{animation:fxtip 1.6s ease-in-out infinite}
@keyframes fxtip{0%,100%{opacity:.55}50%{opacity:1}}
.rkst.br .rk-old{opacity:0}
.rkst.br .rk-n{opacity:1;filter:drop-shadow(0 0 6px rgba(124,196,255,.35))}
.rkst.br .rk-lk{opacity:0}
.rk-beam{position:absolute;left:50%;bottom:-10px;width:240px;height:85%;margin-left:-120px;background:radial-gradient(ellipse 42% 100% at 50% 100%,rgba(124,196,255,.55),rgba(59,167,255,.18) 50%,rgba(59,167,255,0) 85%);filter:blur(6px);transform-origin:bottom;opacity:0;pointer-events:none}
.rkst.br .rk-beam{opacity:.35}
.rkst.br.run .rk-old{opacity:1;animation:none}
.rkst.br.run .rk-c{animation:fxgone .01s linear .05s both}
.rkst.br.run .rk-l{animation:fxsplitl .6s cubic-bezier(.4,0,.6,1) .05s both}
.rkst.br.run .rk-r{animation:fxsplitr .6s cubic-bezier(.4,0,.6,1) .05s both}
.rkst.br.run .rk-beam{animation:fxbeam 1.3s cubic-bezier(.2,.8,.3,1) .1s both}
.rkst.br.run .rk-n{animation:fxborn .75s cubic-bezier(.2,1.35,.4,1) .2s both,fxhalo2 1.2s ease-out .7s both}
.rkst.br.run~.rk-txt{animation:fxtxt .5s ease .8s both}
@keyframes fxgone{to{opacity:0}}
@keyframes fxsplitl{from{opacity:1;transform:none}to{opacity:0;transform:translate(-46px,24px) rotate(-22deg)}}
@keyframes fxsplitr{from{opacity:1;transform:none}to{opacity:0;transform:translate(46px,30px) rotate(20deg)}}
@keyframes fxbeam{0%{opacity:0;transform:scaleY(.2)}30%{opacity:1;transform:scaleY(1)}100%{opacity:.35;transform:scaleY(1)}}
@keyframes fxborn{from{opacity:0;transform:translateY(30px) scale(.5)}to{opacity:1;transform:none}}
@keyframes fxhalo2{0%{filter:drop-shadow(0 0 0 rgba(124,196,255,0))}35%{filter:drop-shadow(0 0 16px rgba(124,196,255,.9))}100%{filter:drop-shadow(0 0 6px rgba(124,196,255,.35))}}
@keyframes fxtxt{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fx.run *,.rkst *,.rk-tip,.fx-ha{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}

/* 3.9.5 · riepilogo a fine sessione */
.rlist{display:flex;flex-direction:column;gap:6px;max-height:282px;overflow-y:auto;overscroll-behavior:contain;margin:-2px 0}
.rrow{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--rc) 45%,transparent);background:color-mix(in srgb,var(--rc) 7%,transparent);flex-shrink:0;min-height:50px}
.rri{width:32px;height:32px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.rlist.run .rrow{animation:rron .45s cubic-bezier(.22,1,.36,1) calc(.35s + var(--i) * .32s) both}
@keyframes rron{0%{opacity:0;transform:translateY(8px) scale(.97);box-shadow:none}55%{opacity:1;box-shadow:0 0 18px color-mix(in srgb,var(--rc) 45%,transparent)}100%{opacity:1;transform:none;box-shadow:none}}
@media (prefers-reduced-motion: reduce){.rlist.run .rrow{animation-duration:.01s;animation-delay:0s}}
.gbump{animation:gbump .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes gbump{0%{transform:scale(1)}40%{transform:scale(1.22);text-shadow:0 0 28px rgba(59,167,255,1)}100%{transform:scale(1)}}
</style>

<body>
<div id="splash" aria-hidden="true"><svg viewBox="0 0 100 100"><path d="M73.38 36.50L50.00 23.00L26.62 36.50L26.62 63.50L50.00 77.00L73.38 63.50L73.38 51" fill="none" stroke="rgba(234,243,255,.10)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M73.38 51H53" fill="none" stroke="rgba(234,243,255,.10)" stroke-width="7" stroke-linecap="round"/><g class="sp-g"><path class="sp-w" pathLength="100" d="M73.38 36.50L50.00 23.00L26.62 36.50L26.62 63.50L50.00 77.00L73.38 63.50L73.38 51" fill="none" stroke="#EAF3FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path class="sp-y" pathLength="100" d="M73.38 51H53" fill="none" stroke="#FFC94D" stroke-width="7" stroke-linecap="round"/></g></svg><span class="sp-word">GESTA</span></div>
<script>
/* frasi della splash: una diversa a ogni apertura, a gruppi alterni (vedi SPLASH in fondo all'elenco). Il segno di punteggiatura resta attaccato a "Gesta". */
(function () {
  /* ricaricata per un aggiornamento mentre l'app era in sottofondo: niente splash e niente frase nuova */
  try { if (sessionStorage.getItem('gesta.quiet') === '1') { sessionStorage.removeItem('gesta.quiet'); var q = document.getElementById('splash'); if (q) q.parentNode.removeChild(q); return; } } catch (e) {}
  try {
    var G = [
      ['Piccole *Gesta*, grandi onori.', 'Piccole *Gesta*, grande gloria.'],
      ['Non servono draghi per compiere grandi *Gesta*.', 'Basta una tuta per compiere grandi *Gesta*.'],
      ['Ogni giorno ha le sue *Gesta*.', 'Anche [giorno] ha le sue *Gesta*.', 'Per le *Gesta* di tutti i giorni.', 'Le *Gesta* di oggi ti aspettano.']
    ], L = [], n = Math.max(G[0].length, G[1].length, G[2].length), k, j;
    for (k = 0; k < n; k++) for (j = 0; j < 3; j++) if (G[j][k]) L.push(G[j][k]);
    var i = 0; try { i = (parseInt(localStorage.getItem('gesta.sp'), 10) || 0) % L.length; localStorage.setItem('gesta.sp', String((i + 1) % L.length)); } catch (e) {}
    var D = ['la domenica', 'il lunedì', 'il martedì', 'il mercoledì', 'il giovedì', 'il venerdì', 'il sabato'];
    var f = L[i].replace('[giorno]', D[new Date().getDay()]);
    var esc = function (x) { return x.replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
    var h = esc(f).replace(/\*Gesta\*([.,;:!?…]*)/, function (m, p) { return '<span class="sp-gw">Gesta' + (p ? '<i>' + p + '</i>' : '') + '</span>'; });
    var w = document.querySelector('#splash .sp-word'); if (w) { var s = document.createElement('span'); s.className = 'sp-line'; s.innerHTML = h; w.parentNode.replaceChild(s, w); }
  } catch (e) {}
})();
</script>
<div id="app"></div>
