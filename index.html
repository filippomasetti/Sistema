<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sistema</title>
<meta name="theme-color" content="#070B14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sistema">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Manrope:wght@500;600;700&display=swap">
<style>
:root{--ground:#070B14;--surface:#0B1220;--raised:#0E1A30;--wfill:rgba(10,20,38,.96);--veil:rgba(3,6,12,.8);--line:#1E2A42;--line2:#2C3D5E;--ink:#EAF3FF;--mut:#8FA3C2;--soft:#C6D6EA;--sys:#3BA7FF;--sysl:#7CC4FF;--glow:#BDEBFF;--onsys:#06101F;--rew:#FFC94D;--fd:"Exo 2","Segoe UI",system-ui,sans-serif;--fb:Manrope,"Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;position:fixed;width:100%;background:var(--ground);color:var(--ink);font:500 15px/22px var(--fb);overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroller{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 10px) max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.nav{flex:0 0 auto;border-top:1px solid var(--line);background:#090F1B;display:flex;align-items:center;justify-content:space-around;padding:2px 40px max(4px,calc(env(safe-area-inset-bottom,0px) - 10px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;border:none;background:none;font:600 10px/13px var(--fb);min-width:76px;min-height:44px;justify-content:center;color:var(--mut);cursor:pointer}
.nav button.on{color:var(--sysl)}
.lbl{font:600 12px/16px var(--fd);letter-spacing:3px;text-transform:uppercase;color:var(--mut)}
.kick{color:var(--sysl)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{margin:0;font:700 clamp(22px,7vw,28px)/1.15 var(--fd);white-space:nowrap}
.scroller>*{flex-shrink:0}
.lv{font:700 14px/18px var(--fd);letter-spacing:1px;border:1px solid var(--sys);border-radius:6px;padding:2px 10px;box-shadow:0 0 14px rgba(59,167,255,.35)}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.fill{height:6px;border-radius:3px;background:var(--sys);box-shadow:0 0 8px var(--sys);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--glow);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
/* calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head button{width:44px;height:32px;border:none;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cal-head button:disabled{opacity:.25}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{text-align:center;font:600 12px/16px var(--fd);letter-spacing:1px;color:var(--mut)}
.cell{position:relative;height:var(--ch,40px);border-radius:6px;border:1px solid var(--line);background:var(--raised);color:var(--mut);display:flex;align-items:center;justify-content:center;font:600 15px/1 var(--fd);padding:0;cursor:default}
.cell.empty{background:transparent;border:none}
.cell.fut{background:transparent;border-style:dashed;color:#6F82A3}
.cell.tap{cursor:pointer}
.cell.sport{border:none;color:#0A0F1A;font-weight:700}
.cell.today{outline:2px solid var(--ink);outline-offset:2px}
.cell.wait{border-color:var(--sysl);color:var(--ink);animation:wait 2s ease-in-out infinite}
.cell .st{position:absolute;top:2px;right:2px;width:9px;height:9px}
.cell.hw{background:#1A2336;border-color:#3A4866;color:var(--soft)}
.cell .hwi{position:absolute;bottom:1px;right:2px;width:10px;height:10px;stroke:#AEBBD3;stroke-width:2.2}
.cell.sport .hwi{stroke:#0A0F1A}
.hwbtn{width:100%;min-height:48px;border-radius:10px;border:1px dashed var(--line2);background:transparent;color:var(--soft);display:flex;align-items:center;justify-content:center;gap:10px;font:600 14px/18px var(--fd);letter-spacing:1px;cursor:pointer}
.hwbtn.on{border-style:solid;border-color:#7E8DAA;background:#1A2336;color:var(--ink)}
.notebtn{border:none;background:none;color:var(--sysl);font:600 12px/16px var(--fb);padding:0;cursor:pointer;text-align:left;min-height:28px}
.fnote{height:40px;font-size:14px}
.fit1{display:block;white-space:nowrap;overflow:hidden}.t28{font:700 28px/34px var(--fd)}.t24{font:700 24px/30px var(--fd)}
.recap-big{font:700 64px/1 var(--fd);text-shadow:0 0 22px rgba(59,167,255,.9)}
.recap-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.recap-grid .fld{align-items:center;gap:2px;padding:10px 6px}
.recap-grid b{font:700 22px/26px var(--fd)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px}
.legend span{display:inline-flex;align-items:center;gap:5px;font:600 11px/14px var(--fb);color:var(--soft)}
.legend i{width:8px;height:8px;border-radius:2px;display:block}
.badge{font:700 20px/24px var(--fd);color:var(--rew);text-shadow:0 0 14px rgba(255,201,77,.45);letter-spacing:1px;text-transform:uppercase}
.weekbar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.weekbar i{display:block;height:6px;border-radius:3px;background:var(--line);transition:background .4s}
.weekbar i.on{background:var(--rew);box-shadow:0 0 8px rgba(255,201,77,.6)}
/* finestre di sistema */
.veil{position:absolute;inset:0;z-index:20;background:var(--veil);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
.win{position:relative;overflow:hidden;width:100%;max-width:420px;max-height:100%;border-radius:14px;background:var(--wfill);border:1px solid var(--sys);box-shadow:0 0 28px rgba(59,167,255,.32),inset 0 0 24px rgba(59,167,255,.08);padding:16px 16px 20px;display:flex;flex-direction:column;gap:16px}
.win::before{content:"";position:absolute;left:24px;right:24px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--glow),transparent)}
.win.gold{border-color:var(--rew);box-shadow:0 0 28px rgba(255,201,77,.3)}
.win.gold::before{background:linear-gradient(90deg,transparent,var(--rew),transparent)}
.win.tall{height:100%}
.whead{display:flex;align-items:center;gap:10px;min-height:28px}
.mark{width:22px;height:22px;flex:0 0 auto;border-radius:6px;border:1.5px solid var(--sysl);display:flex;align-items:center;justify-content:center;font:700 14px/1 var(--fd);color:var(--glow);box-shadow:0 0 14px rgba(59,167,255,.35)}
.wlabel{font:600 12px/16px var(--fd);letter-spacing:3px;text-transform:uppercase;color:var(--sysl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rule{flex:1 1 auto;height:1px;background:linear-gradient(90deg,var(--line2),transparent);min-width:12px}
.x{width:44px;height:44px;margin:-10px -10px -10px 0;border:none;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer}
.wtitle{margin:0;font:600 22px/28px var(--fd);letter-spacing:.5px;text-align:center;text-wrap:balance}
.wtext{margin:0;font:500 14px/21px var(--fb);color:var(--mut);text-align:center}
.wbody{overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;margin:0 -4px;padding:0 4px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.acts.one{grid-template-columns:1fr}
@keyframes open{0%{opacity:0;transform:scaleY(.5) scaleX(.97);filter:blur(6px) brightness(1.8)}60%{opacity:1;filter:blur(0) brightness(1.15)}100%{transform:none;filter:none}}
@keyframes reveal{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes glint{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:translateY(8px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes toast{0%{opacity:0;transform:translateY(-12px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
@keyframes wait{0%,100%{box-shadow:0 0 6px rgba(59,167,255,.25)}50%{box-shadow:0 0 18px rgba(59,167,255,.8)}}
.anim{animation:open 340ms cubic-bezier(.2,.8,.2,1) both}
.anim>*{animation:reveal 200ms ease 160ms both}
.anim::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 35%,rgba(189,235,255,.12) 50%,transparent 65%);animation:glint 700ms ease-out 220ms both}
.fade{animation:fade 220ms ease both}
.pop{animation:pop 600ms cubic-bezier(.2,.8,.2,1) 300ms both}
.toast.low{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
.toast{position:absolute;left:18px;right:18px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:40;border-radius:10px;background:rgba(10,20,38,.97);border:1px solid var(--sys);box-shadow:0 0 14px rgba(59,167,255,.35);padding:10px 14px;display:flex;gap:10px;align-items:center;font:500 13px/18px var(--fb);animation:toast 2.6s ease both;pointer-events:none}
/* controlli */
.btn{height:48px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--ink);font:600 15px/20px var(--fd);letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.btn.main{background:var(--sys);border-color:var(--sys);color:var(--onsys);box-shadow:0 0 14px rgba(59,167,255,.35)}
.btn.sm{height:40px;font-size:12px;letter-spacing:1.5px;padding:0 12px}
.btn.danger{border-color:#5A2C2C;color:#FFB4A8}
.btn:disabled{opacity:.4}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.opt{width:100%;min-height:56px;padding:10px 12px 10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;cursor:pointer;transition:border-color 120ms,box-shadow 120ms,background 120ms}
.opt.on{background:var(--raised);border-color:var(--diff,var(--sysl));box-shadow:0 0 16px rgba(124,196,255,.28)}
.opt.pick{justify-content:flex-start;gap:12px;font:600 16px/22px var(--fd);letter-spacing:.5px}
.optl{font:600 12px/16px var(--fd);letter-spacing:3px;text-transform:uppercase;color:var(--diff)}
.optg{font:600 16px/22px var(--fb)}
.opts{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font:600 13px/16px var(--fd);color:var(--glow)}
.marks{display:flex;gap:3px}.marks i{display:block;width:6px;height:14px;border-radius:3px;background:var(--line2)}.marks i.on{background:var(--diff);box-shadow:0 0 6px var(--diff)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--glow);font:700 20px/1 var(--fd);cursor:pointer;flex:0 0 auto}
.stepper b{min-width:76px;text-align:center;font:700 17px/22px var(--fd);font-variant-numeric:tabular-nums}
.stepper.mini{gap:3px}.stepper.mini button{width:30px;height:34px;border-radius:8px;font-size:16px}
.stepper.mini b{min-width:22px;font-size:15px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;justify-items:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fld{border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.fld.off{opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:transparent;color:var(--soft);font:600 13px/16px var(--fb);cursor:pointer}
.chip.on{border-color:var(--sysl);background:rgba(59,167,255,.14);color:var(--ink)}
.face{width:38px;height:38px;border-radius:19px;border:1px solid var(--line2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.face i{display:block;width:16px;height:16px;border-radius:8px;opacity:.35}
.face.on{border-color:var(--ink)}.face.on i{opacity:1;box-shadow:0 0 8px currentColor}
.inp{width:100%;height:48px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);padding:0 14px;font:600 17px/22px var(--fb);color:var(--ink);outline:none}
.inp:focus{border-color:var(--sysl)}
textarea.inp{height:80px;padding:10px 14px;font-size:15px;resize:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 4px;background:none;border:none;width:100%;color:var(--ink);cursor:pointer;text-align:left}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line2);position:relative;flex:0 0 auto;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:var(--ink);transition:transform .2s}
.sw.on{background:var(--sys)}.sw.on::after{transform:translateX(18px)}
/* stato */
.tile{border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:12px;display:grid;grid-template-columns:28px 1fr auto;row-gap:8px;column-gap:10px;align-items:center;text-align:left;color:var(--ink);cursor:pointer}
.tile svg{width:28px;height:28px}
.tname{font:600 14px/18px var(--fd);letter-spacing:.5px;min-width:0}
.trank{font:700 26px/28px var(--fd)}
.tbar{grid-column:1/-1;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:4px;border-radius:3px}
.logrow{display:flex;align-items:center;gap:10px;min-height:26px;font:500 12px/16px var(--fb)}
.logrow .d{color:var(--mut);width:42px;flex:0 0 auto}
.logrow .t{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logrow .x2{font:600 12px/16px var(--fd);color:var(--glow)}
.dot{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.month{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.split{display:flex;height:6px;gap:2px;width:100%}.split i{display:block;border-radius:2px}
.hint{font:500 12px/17px var(--fb);color:var(--mut)}
.sess{display:flex;align-items:center;gap:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 12px}
.sess .meta{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.sess .meta b{font:600 15px/20px var(--fd)}
.sess .meta span{font:500 12px/16px var(--fb);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);max-width:460px;margin:0 auto;width:100%}
@media (prefers-reduced-motion: reduce){.anim,.anim>*,.anim::after,.fade,.pop,.toast,.cell.wait{animation:none}}
</style>
</head>

      h += '<button class="month" data-a="recap" data-v="' + mk + '" style="color:var(--ink);text-align:left;cursor:pointer"><div class="row" style="align-items:baseline;width:100%"><span style="font:600 14px/18px var(--fd);letter-spacing:2px;text-transform:uppercase">' + MONTHS[m] + ' ' + y + '</span><span style="flex:1 1 auto;text-align:right;font:600 13px/18px var(--fd);color:var(--rew);text-transform:uppercase">' + esc(st.title) + '</span><span style="font:700 22px/24px var(--fd);text-shadow:0 0 10px rgba(59,167,255,.8);min-width:18px;text-align:right">' + st.rank + '</span></div>' +
        '<div class="split">' + split.map(function (p) { return '<i style="flex:' + p[1] + ' 1 0;background:' + SPORTS[p[0]].c + '"></i>'; }).join('') + '</div>' +
        '<div class="row" style="font:500 12px/16px var(--fb);color:var(--soft)"><span>' + st.days + ' giorni</span><span>' + st.qd + '/' + st.qt + ' quest</span><span>' + split.slice(0, 2).map(function (p) { return SPORTS[p[0]].name + ' ' + p[1] + '%'; }).join(' · ') + '</span></div></button>';
    });
    h += '</div></div>';
  } else if (o.t === 'sport') {
    var sp = SPORTS[o.sport], since = addDays(todayKey(), -29), hh = history(o.sport), last30 = hh.filter(function (e) { return e.k >= since; });
    var qdone = hh.filter(function (e) { return e.s.quest && e.s.quest.done === true; }).length, stars = hh.filter(function (e) { return e.s.star; }).length;
    var best = '—';
    if (o.sport === 'gym') { var bw = {}; hh.forEach(function (e) { var d = e.s.d; if (d && d.ex) Object.keys(d.ex).forEach(function (x) { if (!bw[x] || d.ex[x].w > bw[x]) bw[x] = d.ex[x].w; }); }); var ks = Object.keys(bw); best = ks.length ? ks.slice(0, 3).map(function (x) { return x + ' ' + (bw[x] ? kg(bw[x]) : 'corpo libero'); }).join(' · ') : '—'; }
    if (o.sport === 'bld') { var bc = -1; hh.forEach(function (e) { var d = e.s.d; if (d && d.colors) COLORS.forEach(function (c, i) { var v = d.colors[c.k]; if (v && v.c + v.f > 0 && i > bc) bc = i; }); }); best = bc >= 0 ? 'Colore più alto chiuso: ' + COLORS[bc].name.toLowerCase() : '—'; }
    if (o.sport === 'bch') { var bg = -1; hh.forEach(function (e) { var d = e.s.d; if (d && d.f) { var g = 0; FUND.forEach(function (f) { if (d.f[f[0]] === 'g') g++; }); bg = Math.max(bg, g); } }); best = bg >= 0 ? 'Massimo ' + bg + ' fondamentali verdi in una sessione' : '—'; }
    if (o.sport === 'swm') { var bm = 0; hh.forEach(function (e) { if (e.s.d && e.s.d.m > bm) bm = e.s.d.m; }); best = bm ? 'Distanza massima: ' + meters(bm) : '—'; }
    if (o.sport === 'run') { var bk = 0; hh.forEach(function (e) { if (e.s.d && e.s.d.km > bk) bk = e.s.d.km; }); best = bk ? 'Distanza massima: ' + num(bk) + ' km' : '—'; }
    if (o.sport === 'bon') { var names = {}; hh.forEach(function (e) { if (e.s.d && e.s.d.name) names[e.s.d.name] = 1; }); best = Object.keys(names).length ? Object.keys(names).slice(0, 4).join(', ') : '—'; }
    h = '<div class="' + cls + '">' + whead(sp.name, true) + '<div style="display:flex;align-items:center;gap:14px">' + sportIc(o.sport, 40, true) + '<div style="display:flex;flex-direction:column"><span style="font:700 32px/36px var(--fd)">' + last30.length + '</span><span class="hint">volte negli ultimi 30 giorni</span></div></div>' +
      '<div class="fld"><span class="lbl" style="font-size:11px">Traguardo top</span><span style="font:600 15px/21px var(--fb)">' + esc(best) + '</span></div>' +
      '<div class="g2"><div class="fld"><span class="lbl" style="font-size:11px">Quest riuscite</span><span style="font:700 22px/26px var(--fd)">' + qdone + '</span></div><div class="fld"><span class="lbl" style="font-size:11px">Stelle</span><span style="font:700 22px/26px var(--fd)">' + stars + '</span></div></div>' +
      '<p class="wtext" style="font-size:12px">Totale da sempre: ' + hh.length + ' sessioni.</p></div>';
  }
  return '<div class="veil' + (cls.indexOf('anim') >= 0 ? ' fade' : '') + '">' + h + '</div>';
}

function viewRecap(o, cls) {
  var ms = monthStats(o.y, o.m), p = prevMonth(o.y, o.m), pv = monthStats(p.y, p.m), dd = ms.days - pv.days;
  var cmp = !pv.days ? 'Il tuo primo mese nel sistema.' : dd > 0 ? '+' + dd + (dd === 1 ? ' giorno' : ' giorni') + ' rispetto a ' + MONTHS[p.m].toLowerCase() + '.' : dd === 0 ? 'Stessi giorni di ' + MONTHS[p.m].toLowerCase() + ': costanza pura.' : 'Ogni mese conta: questo è nel libro.';
  var h = '<div class="' + cls + ' gold" style="text-align:center;gap:14px">' + whead('Recap · ' + MONTHS[o.m] + ' ' + o.y, !o.first);
  h += '<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span class="lbl" style="color:#D9B04A">Rango del mese</span><span class="recap-big pop">' + ms.rank + '</span></div>';
  h += '<div class="pop" style="display:flex;flex-direction:column;gap:2px"><span class="lbl" style="color:#D9B04A;font-size:11px">Titolo</span><span class="fit1 t24" style="color:var(--rew);text-shadow:0 0 14px rgba(255,201,77,.45);letter-spacing:1px;text-transform:uppercase">' + esc(ms.title) + '</span><span class="hint">' + titleWhy(ms) + '</span></div>';
  h += '<div class="recap-grid"><div class="fld"><b>' + ms.days + '</b><span class="hint">giorni</span></div><div class="fld"><b>' + ms.qd + '</b><span class="hint">quest riuscite</span></div><div class="fld"><b>' + ms.weeksOk + '/' + ms.weeksTot + '</b><span class="hint">settimane</span></div></div>';
  h += '<p class="wtext">' + cmp + (ms.hw ? ' E ' + ms.hw + (ms.hw === 1 ? ' giornata' : ' giornate') + ' di Hard Study/Work.' : '') + '</p>';
  h += '<div class="acts one"><button class="btn main" data-a="recapOk">' + (o.first ? 'Inizia ' + MONTHS[new Date().getMonth()].toLowerCase() : 'Chiudi') + '</button></div></div>';
  return h;
}
function viewDetails(o, cls) {
  var f = o.form, s = o.sport, h = '<div class="' + cls + ' tall" style="gap:12px">' + whead(o.assess ? 'Punto di partenza' : 'Dettagli · ' + SPORTS[s].name, true);
  h += '<div class="wbody" data-keep>';
  if (s === 'gym') {
    h += '<div class="chips">' + GROUP_ORDER.map(function (g) { return '<button class="chip' + (f.group === g ? ' on' : '') + '" data-a="dgroup" data-v="' + g + '">' + GROUPS[g].name + '</button>'; }).join('') + '</div>';
    GROUPS[f.group].ex.forEach(function (ex) {
      var e = f.ex[ex], meta = EX[ex], p = 'ex.' + ex;
      h += '<div class="fld' + (e.on ? '' : ' off') + '"><button class="toggle" style="min-height:36px;padding:0" data-a="exOn" data-v="' + esc(ex) + '"><span style="font:600 15px/20px var(--fd)">' + esc(ex) + (ex === GROUPS[f.group].key ? ' <span class="hint">· quest</span>' : '') + '</span><span class="sw' + (e.on ? ' on' : '') + '"></span></button>';
      if (e.on) h += '<div class="row"><span class="hint">Carico</span>' + stepper(esc(p) + '.w', e.w, meta.inc, 0, function (v) { return v ? kg(v) : 'corpo'; }) + '</div><div class="row"><span class="hint">Ripetizioni · 3 serie</span>' + stepper(esc(p) + '.reps', e.reps, 1, 1, function (v) { return '3×' + v; }) + '</div>';
      h += '</div>';
    });
  } else if (s === 'bld') {
    h += '<p class="hint" style="margin:0">Blocchi della sessione per colore. Flash = chiuso al primo tentativo. WIP = almeno 3-4 tentativi seri, non ancora chiuso.</p>';
    COLORS.forEach(function (c) {
      var v = f.colors[c.k], p = 'colors.' + c.k;
      h += '<div class="fld" style="gap:6px"><div class="row"><span style="display:flex;align-items:center;gap:8px;font:600 15px/20px var(--fd)"><i style="width:14px;height:14px;border-radius:4px;background:' + c.c + ';border:1px solid #5A6478;display:block"></i>' + c.name + '</span></div><div class="trio">' +
        ['c', 'f', 'w'].map(function (x, i) { return '<div style="display:flex;flex-direction:column;align-items:center;gap:2px"><span class="hint" style="font-size:11px">' + ['Chiusi', 'Flash', 'WIP'][i] + '</span>' + stepper(p + '.' + x, v[x], 1, 0, function (n) { return n; }, true) + '</div>'; }).join('') + '</div></div>';
    });
  } else if (s === 'bch') {
    h += '<div class="chips">' + ['allenamento', 'partitella', 'torneo'].map(function (t) { return '<button class="chip' + (f.type === t ? ' on' : '') + '" data-a="btype" data-v="' + t + '">' + t.charAt(0).toUpperCase() + t.slice(1) + '</button>'; }).join('') + '</div>';
    h += '<p class="hint" style="margin:0">Com’è andato ogni fondamentale, rispetto al tuo livello di oggi. Pallini e note sono facoltativi.</p>';
    FUND.forEach(function (x) {
      h += '<div class="fld"' + (f.focus === x[0] ? ' style="border-color:var(--sysl)"' : '') + '><div class="row"><span style="display:flex;flex-direction:column;font:600 15px/20px var(--fd)">' + x[1] + (f.focus === x[0] ? '<span class="hint" style="color:var(--sysl)">focus di oggi</span>' : '') + '</span><div style="display:flex;gap:8px">' + FACES.map(function (fc) { return '<button class="face' + (f.f[x[0]] === fc[0] ? ' on' : '') + '" style="color:' + fc[1] + '" data-a="face" data-v="' + x[0] + '|' + fc[0] + '" aria-label="' + x[1] + ' ' + ({ g: 'verde', y: 'gialla', r: 'rossa' })[fc[0]] + '"><i style="background:' + fc[1] + '"></i></button>'; }).join('') + '</div></div>' +
        (f.nopen[x[0]] ? '<input class="inp fnote" maxlength="140" placeholder="Cosa ricordarti la prossima volta" value="' + esc(f.n[x[0]]) + '" data-f="fn:' + x[0] + '" autocomplete="off">' : '<button class="notebtn" data-a="fnote" data-v="' + x[0] + '">+ nota</button>') + '</div>';
    });
  } else if (s === 'swm') {
    h += '<div class="fld"><div class="row"><span class="hint">Distanza</span>' + stepper('m', f.m, 50, 50, meters) + '</div><div class="row"><span class="hint">Tempo (facoltativo)</span>' + stepper('min', f.min, 1, 0, function (v) { return v ? v + ' min' : '—'; }) + '</div></div>';
  } else if (s === 'run') {
    var pace = f.min && f.km ? f.min / f.km : 0;
    h += '<div class="fld"><div class="row"><span class="hint">Distanza</span>' + stepper('km', f.km, 0.5, 0.5, function (v) { return num(v) + ' km'; }) + '</div><div class="row"><span class="hint">Tempo (facoltativo)</span>' + stepper('min', f.min, 1, 0, function (v) { return v ? v + ' min' : '—'; }) + '</div>' + (pace ? '<span class="hint">Passo: ' + Math.floor(pace) + '’' + pad(Math.round((pace % 1) * 60)) + '” al km</span>' : '') + '</div>';
  } else if (s === 'bon') {
    h += '<div class="fld"><label class="hint" for="bname">Attività</label><input id="bname" class="inp" maxlength="40" placeholder="Squash, sci, yoga…" value="' + esc(f.name) + '" data-f="bname" autocomplete="off"><label class="hint" for="bnote">Nota</label><textarea id="bnote" class="inp" maxlength="280" data-f="bnote">' + esc(f.note) + '</textarea></div>';
  }
  h += '<div class="fld"><button class="toggle" style="min-height:40px;padding:0" data-a="star"><span style="display:flex;align-items:center;gap:10px;font:600 15px/20px var(--fd)">' + svg(IC.star, f.star ? '#FFC94D' : '#8FA3C2', 20) + 'Sessione top</span><span class="sw' + (f.star ? ' on' : '') + '"></span></button><span class="hint">Solo per le giornate davvero speciali: +5 XP e una stella sul calendario.</span></div>';
  h += '</div><button class="btn main" data-a="saveDetails">' + (o.assess ? 'Salva il punto di partenza' : 'Salva') + '</button></div>';
  return h;
}

function viewOnboarding() {
  var o = ui.ob, h = '<div class="ob">';
  var standalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (o.step === 0) {
    h += '<div class="win anim" style="gap:16px">' + whead('Notifica', false) + '<p class="wtitle">Nuovo giocatore rilevato</p><p class="wtext">Il sistema premia la costanza: segni gli sport che fai, ricevi quest, sali di livello. Come ti chiami?</p><input id="obname" class="inp" maxlength="24" placeholder="Il tuo nome" value="' + esc(o.name) + '" data-f="obname" autocomplete="given-name" enterkeyhint="next"><div class="g2"><button class="chip' + (o.g !== 'f' ? ' on' : '') + '" data-a="obG" data-v="m">Il Ragno</button><button class="chip' + (o.g === 'f' ? ' on' : '') + '" data-a="obG" data-v="f">La Ragna</button></div><span class="hint" style="text-align:center;margin-top:-8px">Così il sistema declina i tuoi titoli del mese.</span><button class="btn main" data-a="obNext">Avanti</button></div>';
    if (!standalone) h += '<p class="hint" style="text-align:center">Per averla come app: in Safari tocca Condividi, poi “Aggiungi alla schermata Home”. Fallo prima di iniziare, così i dati restano nell’app.</p>';
  } else {
    h += '<div class="win anim" style="gap:16px">' + whead('Notifica', false) + '<p class="wtitle">Che sport fai, ' + esc(o.name) + '?</p><p class="wtext">Puoi cambiarli quando vuoi dal profilo.</p><div class="g2">' +
      ORDER.map(function (s) { var on = o.sports.indexOf(s) >= 0; return '<button class="opt pick' + (on ? ' on' : '') + '" style="--diff:' + SPORTS[s].c + '" data-a="obSport" data-v="' + s + '">' + sportIc(s) + SPORTS[s].name + '</button>'; }).join('') +
      '</div><div class="acts"><button class="btn" data-a="obBack">Indietro</button><button class="btn main" data-a="obNext">Inizia</button></div></div>';
  }
  return h + '</div>';
}

/* ---------- render ---------- */
var root = document.getElementById('app');
function fitTitles() {
  root.querySelectorAll('.fit1').forEach(function (el) {
    el.style.fontSize = ''; var fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && fs > 13) { fs -= 1; el.style.fontSize = fs + 'px'; }
  });
}
function fitCalendar() {
  if (!S || ui.screen !== 'home') return;
  var sc = root.querySelector('.scroller'), grids = root.querySelectorAll('.scroller .grid7'); if (!sc || grids.length < 2) return;
  var g = grids[1]; g.style.setProperty('--ch', '40px');
  var over = sc.scrollHeight - sc.clientHeight; if (over <= 0) return;
  var rows = Math.ceil(g.children.length / 7);
  g.style.setProperty('--ch', Math.max(28, 40 - Math.ceil(over / rows)) + 'px');
}
window.addEventListener('resize', function () { fitCalendar(); fitTitles(); });
function render() {
  var keep = root.querySelector('[data-keep]'), keepTop = keep ? keep.scrollTop : 0;
  var main = root.querySelector('.scroller'), mainTop = main ? main.scrollTop : 0;
  var focus = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-f');
  var h;
  if (!S) { lastAnim = {}; h = viewOnboarding(); }
  else {
    var body = ui.screen === 'stato' ? viewStato() : ui.screen === 'settings' ? viewSettings() : viewHome();
    if (!ui.ov) lastAnim.ov = null;
    if (ui.screen !== 'home') lastAnim.card = null;
    h = '<div class="scroller">' + body + '</div><nav class="nav"><button class="' + (ui.screen === 'home' ? 'on' : '') + '" data-a="go" data-v="home">' + svg(IC.cal) + 'Calendario</button><button class="' + (ui.screen !== 'home' ? 'on' : '') + '" data-a="go" data-v="stato">' + svg(IC.stato) + 'Stato</button></nav>' + viewOverlay();
  }
  if (toastMsg) h += '<div class="toast' + (S && ui.ov ? ' low' : '') + '"' + (toastShown === toastMsg ? ' style="animation-delay:-' + Math.min(2.5, (Date.now() - toastAt) / 1000) + 's"' : '') + ' role="status"><span class="mark">!</span><span>' + esc(toastMsg) + '</span></div>';
  root.innerHTML = h;
  if (toastMsg && toastShown !== toastMsg) { toastShown = toastMsg; toastAt = Date.now(); }
  fitCalendar(); fitTitles();
  var k2 = root.querySelector('[data-keep]'); if (k2 && keep) k2.scrollTop = keepTop;
  var m2 = root.querySelector('.scroller'); if (m2 && main) m2.scrollTop = mainTop;
  if (ui.focusNext) { focus = ui.focusNext; ui.focusNext = null; }
  if (focus) { var el = root.querySelector('[data-f="' + focus + '"]'); if (el) { el.focus(); try { var l = el.value.length; el.setSelectionRange(l, l); } catch (e) {} } }
  var imp = document.getElementById('imp'); if (imp) imp.onchange = function () { if (imp.files && imp.files[0]) importBackup(imp.files[0]); };
}
root.addEventListener('click', function (e) {
  var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  var fn = A[b.getAttribute('data-a')]; if (fn) fn(b.getAttribute('data-v'));
});
root.addEventListener('input', function (e) {
  var f = e.target.getAttribute('data-f'); if (!f) return;
  if (f === 'obname') ui.ob.name = e.target.value;
  else if (f === 'pname') { var v = e.target.value.trim(); if (v) { S.profile.name = v.slice(0, 24); save(); } }
  else if (f === 'bname') ui.ov.form.name = e.target.value;
  else if (f === 'bnote') ui.ov.form.note = e.target.value;
  else if (f.indexOf('fn:') === 0) ui.ov.form.n[f.slice(3)] = e.target.value;
});
root.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.getAttribute('data-f') === 'obname') { e.preventDefault(); A.obNext(); } });
function resetViewport() { if (window.scrollY || window.scrollX || document.documentElement.scrollTop || document.body.scrollTop) { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; } }
root.addEventListener('focusout', function () { setTimeout(resetViewport, 60); setTimeout(resetViewport, 350); });
window.addEventListener('scroll', resetViewport);
if (window.visualViewport) { window.visualViewport.addEventListener('resize', function () { setTimeout(resetViewport, 60); }); }
window.addEventListener('orientationchange', function () { setTimeout(resetViewport, 300); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) { autoClose(); var n = new Date(); if (ui.vm.y !== n.getFullYear() || ui.vm.m !== n.getMonth()) { /* resta sul mese guardato */ } render(); } });

autoClose();
startupNotice();
render();
try { document.fonts.ready.then(function () { fitTitles(); }); } catch (e) {}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol !== 'file:') { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
window.__sistema = { get state() { return S; }, ui: ui, A: A };
})();
</script>
