<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sistema</title>
<meta name="theme-color" content="#070B14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Sistema">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Manrope:wght@500;600;700&display=swap">
<style>
:root{--ground:#070B14;--surface:#0B1220;--raised:#0E1A30;--wfill:rgba(10,20,38,.96);--veil:rgba(3,6,12,.8);--line:#1E2A42;--line2:#2C3D5E;--ink:#EAF3FF;--mut:#8FA3C2;--soft:#C6D6EA;--sys:#3BA7FF;--sysl:#7CC4FF;--glow:#BDEBFF;--onsys:#06101F;--rew:#FFC94D;--fd:"Exo 2","Segoe UI",system-ui,sans-serif;--fb:Manrope,"Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;position:fixed;width:100%;background:var(--ground);color:var(--ink);font:500 15px/22px var(--fb);overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroller{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 10px) max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.nav{flex:0 0 auto;border-top:1px solid var(--line);background:#090F1B;display:flex;align-items:center;justify-content:space-around;padding:2px 40px max(4px,calc(env(safe-area-inset-bottom,0px) - 10px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;border:none;background:none;font:600 10px/13px var(--fb);min-width:76px;min-height:44px;justify-content:center;color:var(--mut);cursor:pointer}
.nav button.on{color:var(--sysl)}
.lbl{font:600 12px/16px var(--fd);letter-spacing:3px;text-transform:uppercase;color:var(--mut)}
.kick{color:var(--sysl)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{margin:0;font:700 clamp(22px,7vw,28px)/1.15 var(--fd);white-space:nowrap}
.scroller>*{flex-shrink:0}
.lv{font:700 14px/18px var(--fd);letter-spacing:1px;border:1px solid var(--sys);border-radius:6px;padding:2px 10px;box-shadow:0 0 14px rgba(59,167,255,.35)}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.fill{height:6px;border-radius:3px;background:var(--sys);box-shadow:0 0 8px var(--sys);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--glow);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
/* calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head button{width:44px;height:32px;border:none;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cal-head button:disabled{opacity:.25}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{text-align:center;font:600 12px/16px var(--fd);letter-spacing:1px;color:var(--mut)}
.cell{position:relative;height:var(--ch,40px);border-radius:6px;border:1px solid var(--line);background:var(--raised);color:var(--mut);display:flex;align-items:center;justify-content:center;font:600 15px/1 var(--fd);padding:0;cursor:default}
.cell.empty{background:transparent;border:none}
.cell.fut{background:transparent;border-style:dashed;color:#6F82A3}
.cell.tap{cursor:pointer}
.cell.sport{border:none;color:#0A0F1A;font-weight:700}
.cell.today{outline:2px solid var(--ink);outline-offset:2px}
.cell.wait{border-color:var(--sysl);color:var(--ink);animation:wait 2s ease-in-out infinite}
.cell .st{position:absolute;top:2px;right:2px;width:9px;height:9px}
.cell.hw{background:#1A2336;border-color:#3A4866;color:var(--soft)}
.cell .hwi{position:absolute;bottom:1px;right:2px;width:10px;height:10px;stroke:#AEBBD3;stroke-width:2.2}
.cell.sport .hwi{stroke:#0A0F1A}
.hwbtn{width:100%;min-height:48px;border-radius:10px;border:1px dashed var(--line2);background:transparent;color:var(--soft);display:flex;align-items:center;justify-content:center;gap:10px;font:600 14px/18px var(--fd);letter-spacing:1px;cursor:pointer}
.hwbtn.on{border-style:solid;border-color:#7E8DAA;background:#1A2336;color:var(--ink)}
.keyst{width:36px;height:36px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line2);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}.keyst.on{border-color:#7A6430;background:rgba(255,201,77,.08)}
.opt.pick.sm{min-height:46px;padding:8px 10px;gap:10px;font-size:15px}.opt.dim{opacity:.45}
.obwin{max-height:100%;min-height:0;flex:0 1 auto}.obwin .wbody{flex:1 1 auto;min-height:0}.ob{min-height:0}
.notebtn{border:none;background:none;color:var(--sysl);font:600 12px/16px var(--fb);padding:0;cursor:pointer;text-align:left;min-height:28px}
.fnote{height:64px;font-size:14px;padding:8px 12px}
.opt.dayf{flex-direction:column;justify-content:center;align-items:center;gap:6px;min-height:72px;padding:10px 6px;text-align:center;font:600 13px/16px var(--fb)}.opt.dayf i{display:block;width:18px;height:18px;border-radius:9px;background:currentColor;opacity:.4}.opt.dayf.on i{opacity:1;box-shadow:0 0 10px var(--diff)}
.fit1{display:block;white-space:nowrap;overflow:hidden}.t28{font:700 28px/34px var(--fd)}.t24{font:700 24px/30px var(--fd)}
.rules p{margin:0;font:500 14px/21px var(--fb);color:var(--soft)}.rules p b{color:var(--ink)}.rules{display:flex;flex-direction:column;gap:10px}
.rtab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px}.rtab span{font:500 13px/18px var(--fb);color:var(--soft)}.rtab b{display:inline-block;width:20px;font:700 15px/18px var(--fd);color:var(--ink)}
.recap-big{font:700 64px/1 var(--fd);text-shadow:0 0 22px rgba(59,167,255,.9)}
.recap-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.recap-grid .fld{align-items:center;gap:2px;padding:10px 6px}
.recap-grid b{font:700 22px/26px var(--fd)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px}
.legend span{display:inline-flex;align-items:center;gap:5px;font:600 11px/14px var(--fb);color:var(--soft)}
.legend.many{gap:4px 9px}.legend.many span{font-size:10px;line-height:12px}
.legend i{width:8px;height:8px;border-radius:2px;display:block}
.badge{font:700 20px/24px var(--fd);color:var(--rew);text-shadow:0 0 14px rgba(255,201,77,.45);letter-spacing:1px;text-transform:uppercase}
.weekbar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.weekbar i{display:block;height:6px;border-radius:3px;background:var(--line);transition:background .4s}
.weekbar i.on{background:var(--rew);box-shadow:0 0 8px rgba(255,201,77,.6)}
/* finestre di sistema */
.veil{position:absolute;inset:0;z-index:20;background:var(--veil);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
.win{position:relative;overflow:hidden;width:100%;max-width:420px;max-height:100%;border-radius:14px;background:var(--wfill);border:1px solid var(--sys);box-shadow:0 0 28px rgba(59,167,255,.32),inset 0 0 24px rgba(59,167,255,.08);padding:16px 16px 20px;display:flex;flex-direction:column;gap:16px}
.win::before{content:"";position:absolute;left:24px;right:24px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--glow),transparent)}
.win.gold{border-color:var(--rew);box-shadow:0 0 28px rgba(255,201,77,.3)}
.win.gold::before{background:linear-gradient(90deg,transparent,var(--rew),transparent)}
.win.tall{height:100%}
.whead{display:flex;align-items:center;gap:10px;min-height:28px}
.mark{width:22px;height:22px;flex:0 0 auto;border-radius:6px;border:1.5px solid var(--sysl);display:flex;align-items:center;justify-content:center;font:700 14px/1 var(--fd);color:var(--glow);box-shadow:0 0 14px rgba(59,167,255,.35)}
.wlabel{font:600 12px/16px var(--fd);letter-spacing:3px;text-transform:uppercase;color:var(--sysl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rule{flex:1 1 auto;height:1px;background:linear-gradient(90deg,var(--line2),transparent);min-width:12px}
.x{width:44px;height:44px;margin:-10px -10px -10px 0;border:none;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer}
.wtitle{margin:0;font:600 22px/28px var(--fd);letter-spacing:.5px;text-align:center;text-wrap:balance}
.wtext{margin:0;font:500 14px/21px var(--fb);color:var(--mut);text-align:center}
.wbody{overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;margin:0 -4px;padding:0 4px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.acts.one{grid-template-columns:1fr}
@keyframes open{0%{opacity:0;transform:scaleY(.5) scaleX(.97);filter:blur(6px) brightness(1.8)}60%{opacity:1;filter:blur(0) brightness(1.15)}100%{transform:none;filter:none}}
@keyframes reveal{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes glint{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:translateY(8px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes toast{0%{opacity:0;transform:translateY(-12px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
@keyframes wait{0%,100%{box-shadow:0 0 6px rgba(59,167,255,.25)}50%{box-shadow:0 0 18px rgba(59,167,255,.8)}}
.anim{animation:open 340ms cubic-bezier(.2,.8,.2,1) both}
.anim>*{animation:reveal 200ms ease 160ms both}
.anim::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 35%,rgba(189,235,255,.12) 50%,transparent 65%);animation:glint 700ms ease-out 220ms both}
.fade{animation:fade 220ms ease both}
.pop{animation:pop 600ms cubic-bezier(.2,.8,.2,1) 300ms both}
.toast.low{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
.toast{position:absolute;left:18px;right:18px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:40;border-radius:10px;background:rgba(10,20,38,.97);border:1px solid var(--sys);box-shadow:0 0 14px rgba(59,167,255,.35);padding:10px 14px;display:flex;gap:10px;align-items:center;font:500 13px/18px var(--fb);animation:toast 2.6s ease both;pointer-events:none}
/* controlli */
.btn{height:48px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--ink);font:600 15px/20px var(--fd);letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.btn.main{background:var(--sys);border-color:var(--sys);color:var(--onsys);box-shadow:0 0 14px rgba(59,167,255,.35)}
.btn.sm{height:40px;font-size:12px;letter-spacing:1.5px;padding:0 12px}
.btn.danger{border-color:#5A2C2C;color:#FFB4A8}
.btn:disabled{opacity:.4}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.opt{width:100%;min-height:56px;padding:10px 12px 10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;cursor:pointer;transition:border-color 120ms,box-shadow 120ms,background 120ms}
.opt.on{background:var(--raised);border-color:var(--diff,var(--sysl));box-shadow:0 0 16px rgba(124,196,255,.28)}
.opt.pick{justify-content:flex-start;gap:12px;font:600 16px/22px var(--fd);letter-spacing:.5px}
.optl{font:600 12px/16px var(--fd);letter-spacing:3px;text-transform:uppercase;color:var(--diff)}
.optg{font:600 16px/22px var(--fb)}
.opts{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font:600 13px/16px var(--fd);color:var(--glow)}
.marks{display:flex;gap:3px}.marks i{display:block;width:6px;height:14px;border-radius:3px;background:var(--line2)}.marks i.on{background:var(--diff);box-shadow:0 0 6px var(--diff)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--glow);font:700 20px/1 var(--fd);cursor:pointer;flex:0 0 auto}
.stepper b{min-width:76px;text-align:center;font:700 17px/22px var(--fd);font-variant-numeric:tabular-nums}
.stepper.mini{gap:3px}.stepper.mini button{width:30px;height:34px;border-radius:8px;font-size:16px}
.stepper.mini b{min-width:22px;font-size:15px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;justify-items:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fld{border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.fld.off{opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:transparent;color:var(--soft);font:600 13px/16px var(--fb);cursor:pointer}
.chip.mf{width:48px;padding:0;font:700 15px/16px var(--fd)}
.chip.on{border-color:var(--sysl);background:rgba(59,167,255,.14);color:var(--ink)}
.face{width:38px;height:38px;border-radius:19px;border:1px solid var(--line2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.face i{display:block;width:16px;height:16px;border-radius:8px;opacity:.35}
.face.on{border-color:var(--ink)}.face.on i{opacity:1;box-shadow:0 0 8px currentColor}
.inp{width:100%;height:48px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);padding:0 14px;font:600 17px/22px var(--fb);color:var(--ink);outline:none}
.inp:focus{border-color:var(--sysl)}
textarea.inp{height:80px;padding:10px 14px;font-size:15px;resize:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 4px;background:none;border:none;width:100%;color:var(--ink);cursor:pointer;text-align:left}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line2);position:relative;flex:0 0 auto;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:var(--ink);transition:transform .2s}
.sw.on{background:var(--sys)}.sw.on::after{transform:translateX(18px)}
/* stato */
.tile{border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:12px 10px 12px 12px;display:grid;grid-template-columns:28px minmax(0,1fr) auto;row-gap:8px;column-gap:10px;align-items:center;text-align:left;color:var(--ink);cursor:pointer}
.tw{position:relative;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.tw>.tile{width:100%;height:100%}
.tw.lift{z-index:5}.tw.lift>.tile{transform:scale(1.07);box-shadow:0 14px 30px rgba(0,0,0,.55),0 0 18px rgba(59,167,255,.35);border-color:var(--sysl);animation:none;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
.tile.jig{touch-action:none;border-style:dashed;border-color:var(--line2);transition:border-color .2s}
@keyframes jig{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.tile svg{width:28px;height:28px}
.tname{font:600 14px/18px var(--fd);letter-spacing:.3px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trank{font:700 26px/28px var(--fd)}
.tbar{grid-column:1/-1;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:4px;border-radius:3px}
.logrow{display:flex;align-items:center;gap:10px;min-height:26px;font:500 12px/16px var(--fb)}
.logrow .d{color:var(--mut);width:42px;flex:0 0 auto}
.logrow .t{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logrow .x2{font:600 12px/16px var(--fd);color:var(--glow);white-space:nowrap;flex:0 0 auto}
.dot{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.month{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.split{display:flex;height:6px;gap:2px;width:100%}.split i{display:block;border-radius:2px}
.hint{font:500 12px/17px var(--fb);color:var(--mut)}
.sess{display:flex;align-items:center;gap:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 12px}
.sess .meta{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.sess .meta b{font:600 15px/20px var(--fd)}
.sess .meta span{font:500 12px/16px var(--fb);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);max-width:460px;margin:0 auto;width:100%}
@media (prefers-reduced-motion: reduce){.anim,.anim>*,.anim::after,.fade,.pop,.toast,.cell.wait{animation:none}}
</style>
</head>

    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).then(done).catch(function () {});
      return;

    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
